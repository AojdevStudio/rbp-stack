# RBP Stack Configuration Example
# ================================
# Copy to rbp-config.yaml and customize for your project
#
# The RBP Stack (Ralph + Beads + PAI) enables autonomous Epic implementation
# with test-gated verification to prevent lying agents.

project:
  # Your project name (used in logs and progress tracking)
  name: "your-project-name"

  # Brief description of what you're building
  description: "Autonomous Epic implementation with BMAD + Beads"

paths:
  # Where your BMAD stories live (created by /bmad:bmm:workflows:create-story)
  stories: "docs/bmm/implementation-artifacts/stories"

  # Where quick-plan specs are saved (created by /quick-plan)
  specs: "specs"

  # Where beads state is stored (will be created by bd init if missing)
  beads: ".beads"

  # Where RBP scripts are installed (by install.sh)
  scripts: "scripts/rbp"

  # Where slash commands are installed (by install.sh)
  commands: ".claude/commands/rbp"

execution:
  # Maximum Ralph loop iterations before stopping
  # Increase for larger stories, decrease for quick iterations
  max_iterations: 10

  # Subtasks per execution phase (for large tasks)
  # The Execution Sequencer groups subtasks into manageable phases
  phase_size: 5

  # Pause between iterations (seconds)
  # Allows time for file system sync and reduces API rate limiting
  iteration_delay: 2

verification:
  # CRITICAL: Require bun test to pass before closing beads
  # This is the primary defense against lying agents
  require_tests: true

  # Auto-detect UI stories and require Playwright verification
  # UI tasks get additional visual verification layer
  require_playwright_for_ui: true

  # Test commands (adjust for your project's setup)
  test_command: "bun run test"
  typecheck_command: "bun run typecheck"
  playwright_command: "bunx playwright test"

# UI Detection Configuration
# Stories matching these keywords in acceptance criteria
# will automatically require Playwright verification
ui_detection:
  enabled: true
  keywords:
    - "UI"
    - "component"
    - "visual"
    - "browser"
    - "render"
    - "display"
    - "click"
    - "button"
    - "form"
    - "modal"
    - "sidebar"
    - "header"
    - "page"
    - "screen"
    - "responsive"
    - "mobile"
    - "desktop"
    - "layout"
    - "style"
    - "CSS"
    - "frontend"

# BMAD Integration
# Command paths for BMAD workflows (adjust if your BMAD installation differs)
bmad:
  # Create a new story from Epic requirements
  create_story: "/bmad:bmm:workflows:create-story"

  # Developer workflow for implementing stories
  dev_story: "/bmad:bmm:workflows:dev-story"

  # Code review workflow after story completion
  code_review: "/bmad:bmm:workflows:code-review"

# Quick-Plan Integration
# Alternative workflow for feature implementation via /quick-plan specs
quick_plan:
  # Slash command to create specs (interviews you, analyzes codebase)
  command: "/quick-plan"

  # Template for RBP-compatible specs (used by /quick-plan output)
  spec_template: "templates/spec-template.md"

# Codex Pre-Flight Review
# Optional AI review of specs before execution (catches issues early)
codex:
  # Enable Codex review before ralph-execute.sh runs
  # Set to false if you don't have Codex installed
  enabled: true

  # Codex model to use for review
  model: "gpt-5-codex"

  # Reasoning effort level: low, medium, high
  # Higher = more thorough but slower
  reasoning_effort: "high"

  # Skip review by default (override with --skip-review flag)
  # Set to true to speed up iteration during development
  skip_by_default: false

# Hooks Configuration Reference
# These are configured in .claude/settings.json
# Shown here for documentation purposes
hooks:
  # SessionStart: Display current task when opening Claude Code
  session_start:
    - "bd prime 2>/dev/null || true"
    - "scripts/rbp/show-active-task.sh"

  # PreCompact: Save progress before context compaction
  pre_compact:
    - "scripts/rbp/save-progress-to-beads.sh"

# -------------------------------------------------------------------
# Quick Start Guide
# -------------------------------------------------------------------
#
# 1. Install RBP Stack:
#    ./rbp/install.sh /path/to/your/project
#
# 2. Validate installation:
#    ./scripts/rbp/validate.sh
#
# WORKFLOW A: BMAD Stories (structured)
# -------------------------------------
# 3a. Create a story (requires BMAD):
#     /bmad:bmm:workflows:create-story
#
# 4a. Convert story to beads:
#     ./scripts/rbp/parse-story-to-beads.sh docs/bmm/.../story-001.md
#
# 5a. Start autonomous execution:
#     ./scripts/rbp/ralph.sh
#
# WORKFLOW B: Quick-Plan Specs (interview-driven)
# -----------------------------------------------
# 3b. Create a spec via interview:
#     /quick-plan "add user authentication with JWT"
#
# 4b. Execute spec (with optional Codex review):
#     ./scripts/rbp/ralph-execute.sh specs/add-user-authentication.md
#     # Or skip Codex review:
#     ./scripts/rbp/ralph-execute.sh specs/add-user-authentication.md --skip-review
#
# MONITORING (both workflows)
# ---------------------------
# bd status                    # Task overview
# bd list --open              # Open tasks
# tail -f scripts/rbp/progress.txt  # Live progress
#
# -------------------------------------------------------------------
